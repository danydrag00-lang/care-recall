name: Build saved Kokoro interview audio
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-kokoro-audio.yml
      - tools/generate_kokoro_audio.py
      - assets/data.js
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: care-recall-kokoro
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Check out CareRecall
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install voice prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install kokoro-onnx soundfile
      - name: Download Kokoro model
        run: |
          mkdir -p model-cache
          curl -fL --retry 4 --retry-delay 5 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx' -o model-cache/kokoro-v1.0.onnx
          curl -fL --retry 4 --retry-delay 5 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin' -o model-cache/voices-v1.0.bin
          ls -lh model-cache
      - name: Generate 72 questions and answers
        run: python tools/generate_kokoro_audio.py
      - name: Publish saved recordings safely, even if other edits landed during generation
        run: |
          mkdir -p /tmp/care-recall-all-audio
          cp -a audio/. /tmp/care-recall-all-audio/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p audio
            cp -an /tmp/care-recall-all-audio/. audio/
            cp -f /tmp/care-recall-all-audio/manifest.json audio/manifest.json
            git add audio/
            if git diff --cached --quiet; then
              echo 'All generated recordings already published.'
              break
            fi
            git commit -m 'Publish saved Kokoro Q&A recordings'
            if git push origin HEAD:main; then
              echo 'All generated recordings published to main.'
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo 'Error: unable to publish recordings after four attempts.' >&2
              exit 1
            fi
          done
