name: Publish Emma full answers in 4 batches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emma-full-shards.yml'
      - 'tools/generate_emma_full_shard.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kokoro
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y espeak-ng ffmpeg libsndfile1
          python -m pip install -q kokoro-onnx soundfile
      - name: Download neural voice model
        run: |
          mkdir -p model-cache
          curl -fL --retry 4 --retry-delay 5 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx' -o model-cache/kokoro-v1.0.onnx
          curl -fL --retry 4 --retry-delay 5 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin' -o model-cache/voices-v1.0.bin
      - name: Produce Emma full answers — batch ${{ matrix.shard }}
        run: python tools/generate_emma_full_shard.py --shard ${{ matrix.shard }} --shards 4
      - name: Publish generated batch
        run: |
          mkdir -p /tmp/emma-recordings
          cp -a audio/answers-full/. /tmp/emma-recordings/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p audio/answers-full
            cp -an /tmp/emma-recordings/. audio/answers-full/
            git add audio/answers-full/
            if git diff --cached --quiet; then
              echo 'All audio in this batch is already published.'
              break
            fi
            git commit -m 'Publish Emma full answer batch ${{ matrix.shard }}'
            if git push origin HEAD:main; then
              echo 'Published Emma batch ${{ matrix.shard }}.'
              break
            fi
            if [ "$attempt" -eq 8 ]; then
              echo 'Failed to push generated recordings after repeated retries.' >&2
              exit 1
            fi
            sleep $((attempt * 2 + ${{ matrix.shard }}))
          done
