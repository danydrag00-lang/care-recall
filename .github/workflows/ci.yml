name: CareRecall quality checks

on:
  push:
    branches: [main]
    paths:
      - 'assets/*.js'
      - 'assets/*.css'
      - 'listen.html'
      - 'practice.html'
      - 'library.html'
      - 'index.html'
      - 'sw.js'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'assets/*.js'
      - 'listen.html'
      - 'practice.html'
      - 'library.html'
      - 'index.html'
      - 'sw.js'
      - 'tests/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/saved-audio.js
          node --check assets/answer-edits.js
          node --check assets/edited-voice.js
          node --check assets/data.js
          node --check sw.js
      - name: Test listening player and question navigation
        run: node --test tests/site.test.js
      - name: Check live GitHub Pages and saved MP3 streaming
        run: |
          set -e
          ROOT='https://danydrag00-lang.github.io/care-recall'
          for file in listen.html assets/data.js assets/answer-edits.js assets/edited-voice.js assets/style.css assets/editorial.css assets/saved-audio.js audio/manifest.json audio/questions/001.mp3 audio/answers/001.mp3; do
            url="$ROOT/$file"
            status=$(curl --retry 4 --retry-delay 3 -sSL -o /dev/null -w '%{http_code}' --max-time 30 "$url")
            echo "$file => HTTP $status"
            if [ "$status" != '200' ] && [ "$status" != '206' ]; then
              echo "Error: live GitHub Pages asset is missing: $url" >&2
              exit 1
            fi
          done
      - name: Verify all 216 full-answer MP3s are live across three British voices
        run: |
          set -eu
          BASE='https://danydrag00-lang.github.io/care-recall/audio'
          for directory in answers-full voices/bf_isabella/answers-full voices/bm_george/answers-full; do
            verified=0
            for id in $(seq -w 001 072); do
              url="$BASE/$directory/$id.mp3"
              status=$(curl -sSL -I --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}' --max-time 20 "$url")
              if [ "$status" != '200' ] && [ "$status" != '206' ]; then
                echo "Missing full-answer recording HTTP $status: $url" >&2
                exit 1
              fi
              verified=$((verified+1))
            done
            echo "Verified $verified complete-answer MP3s in $directory"
          done
