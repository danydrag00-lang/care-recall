name: Build saved Kokoro interview audio
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-kokoro-audio.yml
      - tools/generate_kokoro_audio.py
      - assets/data.js
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: care-recall-kokoro
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    environment:
      name: github-pages
    steps:
      - name: Check out CareRecall
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install voice prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install kokoro-onnx soundfile
      - name: Download Kokoro model
        run: |
          mkdir -p model-cache
          curl -fL --retry 4 --retry-delay 5 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx' -o model-cache/kokoro-v1.0.onnx
          curl -fL --retry 4 --retry-delay 5 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin' -o model-cache/voices-v1.0.bin
          ls -lh model-cache
      - name: Generate 72 questions and answers
        run: python tools/generate_kokoro_audio.py
      - name: Commit saved MP3 recordings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/
          if ! git diff --cached --quiet; then
            git commit -m 'Add pre-generated Kokoro narration for 72 interview Q&A'
            git push origin HEAD:main
          fi
      - name: Prepare website
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='model-cache' --exclude='_site' --exclude='tools' --exclude='README.md' --exclude='START-HERE.txt' ./ _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
