name: Publish Emma full uploaded answers

on:
  push:
    branches: [main]
    paths:
      - 'tools/generate_emma_full_only.py'
      - '.github/workflows/emma-full-answers.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: care-recall-emma-full-only
  cancel-in-progress: false

jobs:
  build-emma:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kokoro speech prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg libsndfile1
          python -m pip install -q kokoro-onnx soundfile
      - name: Download Kokoro model
        run: |
          mkdir -p model-cache
          curl -fL --retry 4 --retry-delay 5 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx' -o model-cache/kokoro-v1.0.onnx
          curl -fL --retry 4 --retry-delay 5 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin' -o model-cache/voices-v1.0.bin
      - name: Generate all 72 of Emma's full original answers
        run: python tools/generate_emma_full_only.py
      - name: Save finished MP3 recordings into latest main branch
        run: |
          mkdir -p /tmp/care-recall-emma-full
          cp -a audio/answers-full/. /tmp/care-recall-emma-full/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p audio/answers-full
            cp -an /tmp/care-recall-emma-full/. audio/answers-full/
            git add audio/answers-full
            if git diff --cached --quiet; then
              echo 'Full Emma answers already present, no new commit necessary.'
              break
            fi
            git commit -m 'Publish 72 prerecorded Emma full interview answers'
            if git push origin HEAD:main; then
              echo 'Published Emma full answers into latest main branch.'
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo 'Error: unable to push after four attempts.' >&2
              exit 1
            fi
          done
